[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-guard"
version = "0.2.0"
description = "Architecture-boundary enforcement for separate repositories that share one philosophy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Pourrahim" }]
keywords = ["architecture", "boundaries", "imports", "ci", "governance"]
dependencies = []

[project.scripts]
boundary-guard = "boundary_guard.cli:main"

[tool.setuptools]
packages = ["boundary_guard"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["F401", "B"]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
packages = ["boundary_guard"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
