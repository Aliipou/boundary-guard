name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib unittest, no deps)
        run: python -m unittest discover -s tests -t .
      - name: Byte-compile
        run: python -m compileall boundary_guard

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install as a package and run the console script
        run: |
          pip install .
          boundary-guard --version
          boundary-guard viz --policy policy.example.bgpolicy

  self-enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: boundary-guard enforces its own demo (must catch the violation)
        run: |
          if python -m boundary_guard check examples/monorepo-demo --policy policy.example.bgpolicy; then
            echo "expected a boundary violation in the demo, got none"; exit 1
          else
            echo "demo violation correctly caught"
          fi
